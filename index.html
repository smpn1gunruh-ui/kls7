<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Informatika Kelas 7 (Bab 2 - Sistem Komputer)</title>
  <script src="tailwind.js"></script>
  <style>
    body, html { height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    .question-card { transition: all 0.3s ease; }
    .option-button { transition: all 0.2s ease; }
    .option-button:hover { transform: translateX(4px); }
    .timer-warning { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }
  </style>
</head>
<body class="h-full bg-sky-50">
  <div id="app" class="h-full"></div>

  <script>
    // ===================== KONFIGURASI =====================
    const config = {
      exam_title: "Penilaian Bab 2 - Sistem Komputer",
      school_name: "SMP Negeri 1 Gunungguruh",
      subject_info: "Informatika Kelas 7",
      background_color: "#f0f9ff"
    };

    // ===================== SOAL BAB 2 =====================
    let questions = [
      {question:"Apa yang dimaksud dengan sistem komputer?",options:[
        "Gabungan antara perangkat keras dan lunak yang bekerja sendiri",
        "Kumpulan perangkat keras, perangkat lunak, dan brainware yang saling berhubungan untuk mengolah data menjadi informasi",
        "Hanya perangkat keras yang digunakan untuk mengolah data",
        "Semua perangkat elektronik di rumah"],correct:1},

      {question:"Komponen utama sistem komputer terdiri dari...",options:[
        "Hardware, Software, Brainware",
        "CPU, Monitor, Printer",
        "Keyboard, Mouse, Speaker",
        "RAM, ROM, Harddisk"],correct:0},

      {question:"Yang termasuk perangkat keras (hardware) adalah...",options:[
        "Microsoft Word",
        "Windows 11",
        "Keyboard",
        "Google Chrome"],correct:2},

      {question:"Perangkat lunak (software) berfungsi untuk...",options:[
        "Menampilkan hasil cetak di kertas",
        "Menjalankan dan mengendalikan perangkat keras komputer",
        "Menyimpan file di flashdisk",
        "Menghubungkan komputer ke listrik"],correct:1},

      {question:"Orang yang mengoperasikan atau menggunakan komputer disebut...",options:[
        "Software",
        "Hardware",
        "Operator atau Brainware",
        "Processor"],correct:2},

      {question:"CPU merupakan singkatan dari...",options:[
        "Central Processing Unit",
        "Control Power Unit",
        "Central Print Utility",
        "Computer Power Unit"],correct:0},

      {question:"Fungsi utama CPU adalah...",options:[
        "Menyimpan data dan program",
        "Mencetak hasil kerja",
        "Mengolah dan mengontrol jalannya sistem komputer",
        "Menampilkan gambar di layar"],correct:2},

      {question:"Perangkat input adalah...",options:[
        "Perangkat untuk menampilkan hasil pengolahan data",
        "Perangkat untuk memasukkan data ke komputer",
        "Perangkat untuk menyimpan data",
        "Perangkat untuk mencetak hasil"],correct:1},

      {question:"Yang termasuk perangkat output adalah...",options:[
        "Keyboard dan Mouse",
        "Monitor dan Printer",
        "CPU dan RAM",
        "Scanner dan Joystick"],correct:1},

      {question:"Sistem komputer tidak akan dapat bekerja jika...",options:[
        "Tidak ada software",
        "Tidak ada hardware",
        "Tidak ada brainware",
        "Semua benar"],correct:3}
    ];

    // ===================== FUNGSI ACAK =====================
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleQuestions() {
      questions = shuffleArray(questions.map(q => {
        const opts = q.options.map((o, i) => ({text: o, isCorrect: i === q.correct}));
        const shuffled = shuffleArray(opts);
        return {
          question: q.question,
          options: shuffled.map(o => o.text),
          correct: shuffled.findIndex(o => o.isCorrect)
        };
      }));
    }

    // ===================== STATE GLOBAL =====================
    let state = {
      screen: 'start',
      studentName: '',
      studentClass: '',
      current: 0,
      answers: new Array(questions.length).fill(null),
      timeLeft: 600,
      timer: null,
      locked: false
    };

    // ===================== UTILITAS =====================
    function formatTime(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${sec.toString().padStart(2,'0')}`;}
    function startTimer(){state.timer=setInterval(()=>{state.timeLeft--;const t=document.getElementById('timer');if(t){t.textContent=formatTime(state.timeLeft);if(state.timeLeft<=60)t.classList.add('timer-warning');}if(state.timeLeft<=0){clearInterval(state.timer);submitExam();}},1000);}
    async function goFullScreen(){if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}}
    document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&state.screen==="exam"){alert("Anda keluar dari mode full screen! Ujian dikunci.");state.locked=true;clearInterval(state.timer);render();}});

    function selectAnswer(i){if(!state.locked){state.answers[state.current]=i;render();}}
    function navigate(d){if(!state.locked){const n=state.current+d;if(n>=0&&n<questions.length)state.current=n;render();}}
    function calculateScore(){let correct=0;state.answers.forEach((ans,i)=>{if(ans===questions[i].correct)correct++;});return Math.round((correct/questions.length)*100);}

    // ===================== SIMPAN OTOMATIS KE SPREADSHEET =====================
    function submitExam(){
      clearInterval(state.timer);
      const score = calculateScore();
      const correct = state.answers.filter((a,i)=>a===questions[i].correct).length;
      const data = {
        name: state.studentName,
        class: state.studentClass,
        score,
        correct,
        total: questions.length,
        date: new Date().toLocaleString(),
        bab: "Bab 2 - Sistem Komputer"
      };

      // Simpan lokal
      const saved = JSON.parse(localStorage.getItem('hasilUjian') || "[]");
      saved.push(data);
      localStorage.setItem('hasilUjian', JSON.stringify(saved));

      // Kirim otomatis ke Google Spreadsheet
      fetch("https://script.google.com/macros/s/AKfycbzVTgd56dfUMSHugbPkAJlMIpWJ0RDFI8frj4u4hxFSQRWwgDiXAO45WlssyL-KReBwwA/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      state.screen = 'result';
      state.finalScore = score;
      state.correct = correct;
      render();
    }

    // ===================== RENDER =====================
    function render(){
      const app=document.getElementById('app'),s=config;
      if(state.screen==='start'){
        app.innerHTML=`<div class='flex h-full items-center justify-center bg-[${s.background_color}] p-4'><div class='max-w-md w-full bg-white p-8 rounded-2xl shadow-xl'><h1 class='text-2xl font-bold text-center mb-2'>${s.exam_title}</h1><p class='text-center mb-1'>${s.school_name}</p><p class='text-center mb-6'>${s.subject_info}</p><div class='mb-4'><label class='font-semibold'>Nama Siswa</label><input id='name' type='text' class='w-full border rounded-lg p-3 mt-2' placeholder='Nama lengkap'></div><div class='mb-6'><label class='font-semibold'>Kelas</label><select id='class' class='w-full border rounded-lg p-3 mt-2'><option value=''>Pilih Kelas</option><option>7.1</option><option>7.2</option><option>7.3</option><option>7.4</option><option>7.5</option><option>7.6</option><option>7.7</option></select></div><button id='start' class='w-full bg-blue-500 text-white py-3 rounded-lg font-bold hover:bg-blue-600'>Mulai Ujian</button></div></div>`;
        document.getElementById('start').onclick=async()=>{
          const n=document.getElementById('name').value.trim();
          const c=document.getElementById('class').value;
          if(!n||!c)return alert('Isi nama dan kelas terlebih dahulu!');
          state.studentName=n;state.studentClass=c;
          shuffleQuestions();
          await goFullScreen();
          state.screen='exam';state.timeLeft=600;state.locked=false;
          startTimer();render();
        };
      }

      else if(state.screen==='exam'){
        const q=questions[state.current];
        app.innerHTML=`<div class='flex flex-col h-full bg-[${s.background_color}]'><div class='p-4 bg-white shadow flex justify-between items-center'><div><h2 class='font-bold'>${state.studentName}</h2><p class='text-sm'>Kelas ${state.studentClass} • Soal ${state.current+1}/${questions.length}</p></div><div class='text-right'><div id='timer' class='font-bold text-blue-600 text-xl'>${formatTime(state.timeLeft)}</div><p class='text-sm text-slate-600'>Waktu tersisa</p></div></div><div class='flex-1 overflow-y-auto p-4'>${state.locked?`<div class='text-center mt-20 text-red-600 font-bold text-xl'>Ujian dikunci karena keluar dari fullscreen.</div>`:`<div class='max-w-3xl mx-auto bg-white p-6 rounded-xl shadow question-card'><div class='flex mb-4'><span class='bg-blue-500 text-white px-3 py-1 rounded-lg mr-3 font-bold'>${state.current+1}</span><p class='font-semibold'>${q.question}</p></div><div class='space-y-3'>${q.options.map((opt,i)=>{const sel=state.answers[state.current]===i;return `<button class='option-button w-full text-left p-3 border-2 rounded-lg ${sel?'bg-green-500 text-white border-green-600':'border-slate-300'}' data-i='${i}'><span class='font-bold'>${String.fromCharCode(65+i)}.</span> ${opt}</button>`;}).join('')}</div></div><div class='flex justify-between mt-6'><button id='prev' class='px-4 py-2 rounded-lg border border-blue-600 text-blue-700 font-semibold ${state.current===0?'opacity-50 cursor-not-allowed':''}'>← Sebelumnya</button>${state.current===questions.length-1?`<button id='submit' class='px-6 py-2 bg-green-600 text-white font-bold rounded-lg'>Selesai & Kirim</button>`:`<button id='next' class='px-6 py-2 bg-blue-600 text-white font-bold rounded-lg'>Selanjutnya →</button>`}</div>`}</div></div>`;
        document.querySelectorAll('[data-i]')?.forEach(b=>b.onclick=()=>selectAnswer(parseInt(b.dataset.i)));
        document.getElementById('prev')?.addEventListener('click',()=>navigate(-1));
        document.getElementById('next')?.addEventListener('click',()=>navigate(1));
        document.getElementById('submit')?.addEventListener('click',submitExam);
      }

      else if(state.screen==='result'){
        const g=state.finalScore>=90?'A':state.finalScore>=80?'B':state.finalScore>=70?'C':'D';
        const msg=g==='A'?'Luar biasa!':'Tetap semangat, belajar lagi ya!';
        app.innerHTML=`<div class='flex items-center justify-center h-full bg-[${s.background_color}] p-4'><div class='bg-white p-8 rounded-2xl shadow-xl text-center max-w-md w-full'><h1 class='text-2xl font-bold mb-3'>Ujian Selesai!</h1><p class='mb-6'>${msg}</p><div class='grid grid-cols-2 gap-4 mb-6'><div class='bg-blue-50 rounded-lg p-4'><div class='text-4xl font-bold text-blue-600'>${state.finalScore}</div><p>Nilai</p></div><div class='bg-green-50 rounded-lg p-4'><div class='text-4xl font-bold text-green-600'>${g}</div><p>Predikat</p></div></div><button id='finish' class='w-full bg-blue-600 text-white py-3 rounded-lg font-bold'>Tutup</button></div></div>`;
        document.getElementById('finish').onclick=()=>{document.exitFullscreen();state.screen='start';render();};
      }
    }

    render();
  </script>
</body>
</html>
